[package]
name = "pfaedle-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
osmpbfreader = "0.19.1"
gtfs-structures = "0.46.1"
geo = { version = "0.32", features = ["use-serde"] }
rstar = "0.12"
anyhow = "1.0"
csv = "1.4"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
css-color = "0.2.8"
rayon = "1.10"
ahash = { version = "0.8", features = ["serde"] }
lru = "0.16"
bincode = "1.3"
rustix = { version = "1.1.2", features = ["process"] }
dashmap = "5.5"
travelling_salesman = "1.1"
time = "0.3"
rkyv = "0.8.17"
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"
